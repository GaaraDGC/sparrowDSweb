<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>麻雀廣告工作室 — 始於看見，终于信任</title>
  <meta name="description" content="專注 AIGC 的廣告工作室，提供視頻廣告、品牌視覺與網站服務。" />
  <meta property="og:title" content="麻雀廣告工作室" />
  <meta property="og:description" content="專注 AIGC 的廣告工作室，提供視頻廣告、品牌視覺與網站服務。" />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none';">
  <link rel="stylesheet" href="styles.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "麻雀廣告工作室",
    "url": ".",
    "contactPoint": [{"@type":"ContactPoint","email":"gaarad@foxmail.com","contactType":"Business"}]
  }
  </script>
</head>
<body>
  <header class="site-header" role="banner">
    <nav class="nav" role="navigation" aria-label="主選單">
      <a href="#hero">首頁</a>
      <a href="#services">服務</a>
      <a href="#cases">案例</a>
      <a href="#contact">聯絡</a>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero" aria-labelledby="site-title">
      <div class="hero-inner">
        <h1 id="site-title">麻雀廣告工作室</h1>
        <p class="tagline">始於看見，终于信任 — AIGC 驅動的視頻廣告與品牌內容</p>
        <p><a class="cta" href="#cases">查看案例</a></p>
      </div>
    </section>

    <section id="services" class="services container" aria-labelledby="services-title">
      <h2 id="services-title">核心服務</h2>
      <div class="service-grid">
        <article class="service-card"><h3>廣告市場調查</h3><p>深入消費者與競品洞察。</p></article>
        <article class="service-card"><h3>AIGC 視頻廣告定制</h3><p>快速製片流程與素材輸出。</p></article>
        <article class="service-card"><h3>企業官網搭建</h3><p>靜態部署、響應式設計。</p></article>
      </div>
    </section>

    <section id="cases" class="cases container" aria-labelledby="cases-title">
      <h2 id="cases-title">案例展示</h2>
      <div id="cases-grid" class="grid" role="list"></div>
    </section>

    <section id="contact" class="contact container" aria-labelledby="contact-title">
      <h2 id="contact-title">商務合作 · 递交Brief</h2>
      <p>點擊按鈕以發送需求郵件給我們。</p>
      <button id="mailtoBtn" class="mail-btn" aria-label="提交廣告需求郵件">提交广告需求邮件</button>
    </section>
  </main>

  <footer class="site-footer container" role="contentinfo">
    <p>© 麻雀廣告工作室</p>
  </footer>

  <script src="scripts.js" defer></script>
</body>
</html>
